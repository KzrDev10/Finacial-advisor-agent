<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — FinanceAI</title>
  <meta name="description" content="Sign in to your FinanceAI account." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Shared stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />

  <style>
    /* ---- AUTH PAGE LAYOUT ---- */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .auth-bg-gradient {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 80% 20%, rgba(0, 212, 255, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 20% 80%, rgba(57, 255, 110, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(124, 58, 237, 0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .auth-card {
      background: rgba(17, 23, 32, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid var(--color-border);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s var(--ease-out) forwards;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--color-accent), var(--color-lime), transparent);
      border-radius: 28px 28px 0 0;
      opacity: 0.6;
    }

    .auth-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 2rem;
      text-decoration: none;
      color: var(--color-white);
    }

    .auth-logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--color-accent), var(--color-lime));
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      font-weight: 900;
      color: #000;
      flex-shrink: 0;
    }

    .auth-heading {
      font-family: var(--font-display);
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
      line-height: 1.15;
    }

    .auth-subheading {
      font-size: 0.9rem;
      color: var(--color-grey-1);
      margin-bottom: 2rem;
    }

    .auth-subheading a {
      color: var(--color-accent);
      font-weight: 600;
      transition: color 0.2s;
    }

    .auth-subheading a:hover {
      color: var(--color-lime);
    }

    /* ---- FORM ---- */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-grey-1);
      letter-spacing: 0.03em;
    }

    .form-forgot {
      font-size: 0.78rem;
      color: var(--color-accent);
      font-weight: 500;
      transition: color 0.2s;
    }

    .form-forgot:hover {
      color: var(--color-lime);
    }

    .form-input {
      padding: 0.8rem 1rem;
      background: rgba(8, 12, 16, 0.7);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      color: var(--color-white);
      font-size: 0.9rem;
      font-family: var(--font-primary);
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
      width: 100%;
    }

    .form-input::placeholder {
      color: var(--color-grey-2);
    }

    .form-input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.08);
    }

    .form-input.error {
      border-color: #ff5f5f;
      box-shadow: 0 0 0 3px rgba(255, 95, 95, 0.08);
    }

    .form-error {
      font-size: 0.75rem;
      color: #ff5f5f;
      display: none;
    }

    .form-error.visible {
      display: block;
    }

    .form-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--color-grey-2);
      font-size: 0.8rem;
      margin: 0.5rem 0;
    }

    .form-divider::before,
    .form-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .btn-auth {
      width: 100%;
      padding: 0.9rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: var(--font-primary);
      cursor: pointer;
      border: none;
      transition: all 0.3s var(--ease-out);
    }

    .btn-auth-primary {
      background: linear-gradient(135deg, var(--color-accent), #0099bb);
      color: #000;
    }

    .btn-auth-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 35px rgba(0, 212, 255, 0.3);
    }

    .btn-auth-oauth {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--color-border);
      color: var(--color-white);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .btn-auth-oauth:hover {
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.07);
    }

    /* Welcome badge */
    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.85rem;
      border-radius: 100px;
      border: 1px solid rgba(57, 255, 110, 0.3);
      background: rgba(57, 255, 110, 0.06);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--color-lime);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      width: fit-content;
    }

    .auth-badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--color-lime);
      animation: pulse 2s ease-in-out infinite;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>

<body>

  <!-- Cursor glow -->
  <div class="cursor-glow" id="cursor-glow"></div>
  <!-- Particle canvas -->
  <canvas id="particle-canvas"></canvas>

  <div class="auth-bg-gradient" aria-hidden="true"></div>

  <main class="auth-page" id="login-page">
    <div class="auth-card">

      <!-- Logo -->
      <a href="/" class="auth-logo" aria-label="FinanceAI Home">
        <div class="auth-logo-icon">F</div>
        FinanceAI
      </a>

      <div class="auth-badge">
        <span class="auth-badge-dot" aria-hidden="true"></span>
        Secure login
      </div>

      <h1 class="auth-heading">Welcome back</h1>
      <p class="auth-subheading">
        Don't have an account? <a href="{{ url_for('signup') }}">Sign up free</a>
      </p>

      <!-- OAuth -->
      <button class="btn-auth btn-auth-oauth" id="google-login-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335"
            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
          <path fill="#4285F4"
            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
          <path fill="#FBBC05"
            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
          <path fill="#34A853"
            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
        </svg>
        Continue with Google
      </button>

      <div class="form-divider">or sign in with email</div>

      <!-- Login form -->
      <form class="auth-form" id="login-form" method="POST" action="{{ url_for('login') }}" novalidate>

        <div class="form-group">
          <label class="form-label" for="login-email">Email address</label>
          <input class="form-input {% if errors.get('email') %}error{% endif %}" type="email" id="login-email"
            name="email" placeholder="you@example.com" autocomplete="email" value="{{ email or '' }}" required />
          <span class="form-error {% if errors.get('email') %}visible{% endif %}" id="login-email-error">{{
            errors.get('email', 'Please enter a valid email address.') }}</span>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="login-password">Password</label>
            <a href="#" class="form-forgot" id="forgot-password-link">Forgot password?</a>
          </div>
          <input class="form-input {% if errors.get('password') or errors.get('auth') %}error{% endif %}"
            type="password" id="login-password" name="password" placeholder="Enter your password"
            autocomplete="current-password" required />
          <span class="form-error {% if errors.get('password') %}visible{% endif %}" id="login-password-error">{{
            errors.get('password', 'Password is required.') }}</span>
          <span class="form-error {% if errors.get('auth') %}visible{% endif %}" id="login-auth-error">{{
            errors.get('auth', '') }}</span>
        </div>

        <button type="submit" class="btn-auth btn-auth-primary" id="login-submit-btn">
          Sign in
        </button>

      </form>
    </div>
  </main>

  <!-- Particle + cursor script -->
  <script src="{{ url_for('static', filename='home.js') }}" defer></script>

  <script>
    /* ---- LOGIN FORM VALIDATION ---- */
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      let valid = true;

      const email = document.getElementById('login-email');
      const password = document.getElementById('login-password');

      if (!email.value.includes('@') || !email.value.includes('.')) {
        email.classList.add('error');
        document.getElementById('login-email-error').classList.add('visible');
        valid = false;
      } else {
        email.classList.remove('error');
        document.getElementById('login-email-error').classList.remove('visible');
      }

      if (!password.value) {
        password.classList.add('error');
        document.getElementById('login-password-error').classList.add('visible');
        valid = false;
      } else {
        password.classList.remove('error');
        document.getElementById('login-password-error').classList.remove('visible');
      }

      if (valid) {
        const btn = document.getElementById('login-submit-btn');
        btn.textContent = '✓ Signing you in...';
        btn.style.background = 'linear-gradient(135deg,#39ff6e,#28cc55)';
        btn.style.color = '#000';
        btn.disabled = true;
      }
    });
  </script>
</body>

</html>
